name: Build Aria Companion

on:
  push:
    branches:
      - aria-companion-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build GBARunner3
        run: make -C code
      - name: Prepare artifact
        run: |
          mkdir -p out/_gba
          cp -f code/bootstrap/GBARunner3.nds out/
          cp -r configs out/_gba/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GBARunner3-Aria-Companion-v1
          path: out
